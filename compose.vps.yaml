# Production on the VPS. caddy-docker-proxy and homepage find the service through
# its labels, on the shared `web` network. No port is published.
#
# Values come from .env next to this file, copied from .env.example. Compose reads
# it by itself. Never put real values in this file: the repository is public.
#
#   docker compose up -d                                 start
#   docker compose pull && docker compose up -d          update
services:
  live:
    image: ghcr.io/tomashutnan/live:${LIVE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - LIVE_ADMIN_USER=${LIVE_ADMIN_USER:?set it in .env}
      - LIVE_ADMIN_PASSWORD_HASH=${LIVE_ADMIN_PASSWORD_HASH:?run hash-password and put the line in .env}
      - LIVE_PUBLIC_ORIGIN=https://${LIVE_DOMAIN:?set it in .env}
      - LIVE_ABOUT_URL=${LIVE_ABOUT_URL:-}
    volumes:
      - ${LIVE_DATA_PATH:?set it in .env}:/data # must be owned by uid 1000
    networks:
      - web
    # Only /data is writable, and the process runs as uid 1000.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      caddy: ${LIVE_DOMAIN}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: "{{upstreams 8090}}"
      homepage.group: Services
      homepage.name: Live
      homepage.href: https://${LIVE_DOMAIN}
      homepage.description: Live presentations
      homepage.icon: mdi-presentation-play

networks:
  web:
    external: true
